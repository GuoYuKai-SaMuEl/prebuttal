[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prebuttal"
dynamic = ["version"]
description = "Pre-submission review stress test for ML papers: three independent AI reviewers + an area chair, real conference review forms, measured disagreement."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prebuttal contributors" }]
maintainers = [{ name = "GuoYuKai-SaMuEl" }]
keywords = [
  "peer-review",
  "neurips",
  "iclr",
  "icml",
  "acl",
  "reviewer2",
  "llm",
  "arxiv",
  "papers",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "pdfplumber>=0.11.0",
  "pdfminer.six>=20231228",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]
calibration = ["openreview>=1.42", "matplotlib>=3.8"]

[project.scripts]
prebuttal = "prebuttal.cli:main"

[project.urls]
Homepage = "https://github.com/GuoYuKai-SaMuEl/prebuttal"
Issues = "https://github.com/GuoYuKai-SaMuEl/prebuttal/issues"
Changelog = "https://github.com/GuoYuKai-SaMuEl/prebuttal/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["prebuttal*"]

[tool.setuptools.package-data]
prebuttal = ["personas/*.md", "venues/forms/*.md", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "prebuttal.__version__" }

[tool.mypy]
python_version = "3.11"
files = ["prebuttal"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "pdfminer", "pdfminer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Text I/O without encoding= silently uses the locale code page on Windows
# (cp1252, cp950...). CI sets PYTHONWARNDEFAULTENCODING=1 so any such call
# fails the suite on every OS; locally: `python -X warn_default_encoding -m pytest`.
filterwarnings = [
  "error::EncodingWarning",
  # third-party code we can't fix (later entries win)
  "ignore::EncodingWarning:pypdfium2_raw.version",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS template lines are inherently long; σ/en-dash are intentional UI typography
"prebuttal/share.py" = ["E501", "RUF001"]
"scripts/*" = ["E402"] # bootstrap scripts sys.path.insert before imports
"tests/test_calibration.py" = ["E402"] # imports the script via sys.path
# the regression test asserts on real PDF glyphs (math minus U+2212, en dash)
"tests/test_pdf_regression.py" = ["RUF001"]
