name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Warn on text I/O without encoding= (pytest turns it into an error, see
# pyproject.toml): the bug only shows on non-UTF-8 Windows locales otherwise.
env:
  PYTHONWARNDEFAULTENCODING: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned so new ruff releases can't break CI overnight.
        run: python -m pip install ruff==0.17.2
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + mypy
        run: python -m pip install -e . "mypy==2.4.0"
      - name: Mypy
        run: python -m mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q --durations=10

  real-papers:
    name: Test (real arXiv papers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREBUTTAL_REAL_PAPERS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache downloaded papers
        # pinned arXiv versions never change: fetch once, not on every run
        uses: actions/cache@v4
        with:
          path: ~/.cache/prebuttal/test-papers
          key: test-papers-${{ hashFiles('tests/test_pdf_real_papers.py') }}
          restore-keys: test-papers-
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run real-paper tests
        run: python -m pytest -q tests/test_pdf_real_papers.py

  min-deps:
    name: Test (oldest supported dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the lower bounds declared in pyproject.toml
        # keep in sync with [project.dependencies]
        run: |
          python -m pip install "pdfplumber==0.11.0" "pdfminer.six==20231228" "httpx==0.27.0"
          python -m pip install --no-deps -e .
          python -m pip install pytest reportlab
      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build & verify dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine metadata check
        run: python -m twine check --strict dist/*
      - name: Test suite runs from the sdist
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/prebuttal-*
          python -m pip install ".[dev]"
          python -m pytest -q
      - name: Verify package data ships (personas / venue forms)
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python - <<'EOF'
          from prebuttal.personas import load_persona
          from prebuttal.venues import get_venue
          assert "Reviewer 2" in load_persona("adversarial")
          assert "Rating" in get_venue("iclr").form_text()
          print("package data OK")
          EOF

  action:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: A clean paper passes
        uses: ./
        with:
          paper: examples/weak-paper
          venue: iclr
      - name: A paper with an unresolved reference fails
        id: broken
        continue-on-error: true
        uses: ./
        with:
          paper: examples/demo-paper
          venue: iclr
      - name: Expect the failure
        shell: bash
        run: test "${{ steps.broken.outcome }}" = failure
